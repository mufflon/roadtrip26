name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: only what Pages deployment needs. No repository secrets.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight run, but never cancel a real deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The data checker runs on every push AND every pull request. On a PR it gates
  # the merge without deploying; a bad data file can never reach production.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      # Generate data/*.js from content/*.yaml, then validate it.
      - run: bash build.sh

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Must match the repository name so the Pages subpath resolves.
          PATH_PREFIX: "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
